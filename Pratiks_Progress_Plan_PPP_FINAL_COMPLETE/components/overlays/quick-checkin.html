<div id="quickModal" class="modal-backdrop hidden">
  <div class="modal glass">
    <div class="modal-head"><h2>⚡ Quick Check-in</h2><button class="icon-btn" id="closeQuick">✕</button></div>
    <p class="k-sub">Choose a mode. You can refine details in Today's Check-in.</p>
    <div class="quick-grid" style="grid-template-columns:repeat(2,1fr)">
      <button class="input-card glass btn" data-quick="minimum"><strong>Minimum Progress Day</strong><div class="k-sub">Audi 25m, Coursera ML 15m, German 15m.</div></button>
      <button class="input-card glass btn" data-quick="solid"><strong>Focused Career Day</strong><div class="k-sub">Audi, System Design, Coursera ML, and German.</div></button>
      <button class="input-card glass btn" data-quick="full"><strong>Full Target Day</strong><div class="k-sub">Apply every configured daily goal target.</div></button>
      <button class="input-card glass btn" data-quick="recovery"><strong>Reading Recovery Day</strong><div class="k-sub">Motivational, German story, and spoken-English reading.</div></button>
    </div>
    <div class="modal-actions"><button class="btn" id="openDetailed">Open Detailed Check-in</button></div>
  </div>
</div>
