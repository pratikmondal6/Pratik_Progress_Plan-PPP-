  <section id="calendar" class="panel">
    <div class="section-head">
      <div><h2>Calendar & Data</h2><p>Your ten learning goals, sleep, notes, and daily progress in one editable timeline.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="tableStartBtn">Start of Table</button>
        <button class="btn" id="jumpTodayBtn">Jump to Today</button>
      </div>
    </div>
    <div class="table-wrap" id="calendarTableWrap">
      <table class="calendar-table">
        <thead><tr id="calendarHeadRow"></tr></thead>
        <tbody id="dataBody"></tbody>
      </table>
    </div>
  </section>
