<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPP Activity Tracker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div class="logo">PPP</div><div><h1>Activity Tracker</h1><p>Private active-tab timing</p></div><span class="status" id="status">ON</span></header>
    <section class="live"><span class="pulse" id="pulse"></span><div><small>Currently tracking</small><strong id="liveDomain">Loading…</strong></div></section>
    <section class="total"><small>Active browser time today</small><strong id="todayTotal">—</strong></section>
    <div class="metrics">
      <div><span>Productive</span><strong id="productive">—</strong></div>
      <div><span>Distraction</span><strong id="distracting">—</strong></div>
      <div><span>Focus ratio</span><strong id="ratio">—</strong></div>
    </div>
    <div class="actions">
      <button id="toggleBtn">Pause tracking</button>
      <button class="primary" id="openBtn">Open PPP dashboard</button>
    </div>
    <button class="danger" id="resetBtn">Reset today’s activity</button>
    <p class="privacy">Only domains and active seconds are stored locally. No full URLs, titles, searches, or database.</p>
  </main>
<script src="popup.js"></script>
</body>
</html>
